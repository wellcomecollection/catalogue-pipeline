# Backplane (backplane/v1) description of this repository's software, gathered
# into https://github.com/wellcomecollection/catalog. A Component that deploys
# independently points at the deploy tracker config in its own folder.
apiVersion: backplane/v1
kind: System
metadata:
  name: catalogue-pipeline
  description: The data pipeline services extracting and transforming catalogue data
  annotations:
    github.com/project-slug: wellcomecollection/catalogue-pipeline
  links:
    - title: Runbook
      url: https://github.com/wellcomecollection/catalogue-pipeline/blob/main/docs/adapters/runbook.md
spec:
  owner: team:default/digital-platform
---
apiVersion: backplane/v1
kind: Component
metadata:
  name: catalogue-graph
  description: Python lambdas for the catalogue adapters, graph and dated pipelines
  annotations:
    github.com/project-slug: wellcomecollection/catalogue-pipeline
    backstage.io/source-location: url:https://github.com/wellcomecollection/catalogue-pipeline/tree/main/catalogue_graph/
    wellcomecollection.org/deploy-tracker: catalogue_graph/.deploy-tracker.yml
    backplane/dora-paths: catalogue_graph
  links:
    - title: Runbook
      url: https://github.com/wellcomecollection/catalogue-pipeline/blob/main/docs/adapters/runbook.md
spec:
  type: service
  lifecycle: production
  owner: team:default/digital-platform
  system: system:catalogue-pipeline
  environments:
    - name: prod
      tier: production
      github:
        task: "deploy:catalogue_graph"
