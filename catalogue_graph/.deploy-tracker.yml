# yaml-language-server: $schema=https://raw.githubusercontent.com/wellcomecollection/deploy-tracker/main/schema/deploy-tracker.schema.json
#
# Deploy tracker config for the catalogue_graph unit: the Python lambdas and
# tasks the "Catalogue pipeline: Deploy" workflow updates. Only pull requests
# touching this directory are reported, and deployments carry task
# deploy:catalogue_graph. There is no stage and no HTTP surface, so no
# checkpoints: "deployed" is as far as the tracker can see.
version: 1

slack:
  channel: "#wc-platform-deploys"

services:
  # No paths, so it claims everything the development service below does not.
  # A directory added later is reported rather than quietly dropped, which is
  # the safer way round: a deploy reported that did not ship is visible, and one
  # that shipped and was not reported is not.
  catalogue-graph:

  # Not deployed by any environment, which is what holds these back. Neither
  # lambda.Dockerfile nor task.Dockerfile copies any of them into an image: both
  # take src/, pyproject.toml, uv.lock and certs/, and the lambda adds the single
  # file infra/lambda_extensions/secrets_extension.py, which is why the tests
  # beside it are listed here. infra/adapters/ and infra/graph/ are Terraform
  # that no workflow applies, so a change there is not shipped by this deploy.
  # document_generators/ is run by CI and feeds fixtures to catalogue-api, but
  # nothing in an image imports it.
  development:
    paths:
      - tests/
      - docs/
      - notebooks/
      - integration/
      - type_stubs/
      - document_generators/
      - scripts/
      - infra/lambda_extensions/tests/
      - infra/adapters/
      - infra/graph/
      - docker-compose.yml
      - elasticsearch.docker-compose.yml
      - mysql.docker-compose.yml
      - README.md

environments:
  prod:
    deploys: [catalogue-graph]

labels: true
pr_comments: true
