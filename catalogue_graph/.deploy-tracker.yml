# yaml-language-server: $schema=https://raw.githubusercontent.com/wellcomecollection/deploy-tracker/main/schema/deploy-tracker.schema.json
#
# The lambdas and tasks .github/workflows/catalogue-graph-deploy.yml updates.
# No HTTP surface, so no checkpoints: "deployed" is as far as the tracker sees.
version: 1

slack:
  channel: "#wc-platform-deploys"

services:
  # No paths, so anything not listed below is reported. Erring that way round:
  # a deploy reported that did not ship is visible, the reverse is not.
  catalogue-graph:

  # Deployed by nothing, which is what holds these back. Neither Dockerfile
  # copies any of them: both take src/, pyproject.toml, uv.lock and certs/, and
  # the lambda adds infra/lambda_extensions/secrets_extension.py alone.
  development:
    paths:
      - tests/
      - docs/
      - notebooks/
      - integration/
      - type_stubs/
      - document_generators/
      - scripts/
      - infra/lambda_extensions/tests/
      # Terraform, applied by no workflow
      - infra/adapters/
      - infra/graph/
      - docker-compose.yml
      - elasticsearch.docker-compose.yml
      - mysql.docker-compose.yml
      - README.md

environments:
  prod:
    deploys: [catalogue-graph]

labels: true
pr_comments: true
