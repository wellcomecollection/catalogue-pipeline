version: "3.8"

services:
  calm-transformer:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      - AWS_DEFAULT_REGION=eu-west-1
      - AWS_REGION=eu-west-1
      - AWS_EC2_METADATA_DISABLED=true
      - AWS_ENDPOINT_URL_SQS=http://localstack:4566
      - AWS_ENDPOINT_URL_SNS=http://localstack:4566
      - queue_url=http://localstack:4566/000000000000/calm-transformer-queue
      - sns_topic_arn=arn:aws:sns:eu-west-1:000000000000:calm-transformer-topic
      - metrics_namespace=calm-transformer
      - batch_size=100
      - flush_interval_seconds=30
    env_file:
      - .env
    depends_on:
      localstack:
        condition: service_healthy
      localstack-setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: "public.ecr.aws/localstack/localstack:3.5.0"
    environment:
      - SERVICES=sqs,sns
      - ALLOW_NONSTANDARD_REGIONS=1
    ports:
      - "4566:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack-setup:
    image: "public.ecr.aws/localstack/localstack:3.5.0"
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: []
    command:
      - sh
      - -c
      - |
        set -eu
        awslocal sqs create-queue --queue-name calm-transformer-queue --region eu-west-1
        awslocal sqs create-queue --queue-name calm-transformer-dlq --region eu-west-1
        QUEUE_URL=$$(awslocal sqs get-queue-url --queue-name calm-transformer-queue --region eu-west-1 --query QueueUrl --output text)
        DLQ_URL=$$(awslocal sqs get-queue-url --queue-name calm-transformer-dlq --region eu-west-1 --query QueueUrl --output text)
        DLQ_ARN=$$(awslocal sqs get-queue-attributes --queue-url "$$DLQ_URL" --attribute-names QueueArn --region eu-west-1 --query Attributes.QueueArn --output text)
        ATTRIBUTES_JSON=$$(printf '{"RedrivePolicy":"{\\"deadLetterTargetArn\\":\\"%s\\",\\"maxReceiveCount\\":\\"2\\"}"}' "$$DLQ_ARN")
        awslocal sqs set-queue-attributes \
          --queue-url "$$QUEUE_URL" \
          --attributes "$$ATTRIBUTES_JSON" \
          --region eu-west-1
        awslocal sns create-topic --name calm-transformer-topic --region eu-west-1
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-1
    restart: "no"

  es-setup:
    image: curlimages/curl:8.5.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -c "
        set -eu
        echo 'Waiting for Elasticsearch...' &&
        until curl -s http://elasticsearch:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'; do
          sleep 2
        done &&
        echo 'Checking if index exists...' &&
        if curl -s -o /dev/null -w '%{http_code}' http://elasticsearch:9200/${es_index} | grep -q 404; then
          echo 'Creating index with analysis and mappings...' &&
          analysis_json=$$(cat /config/analysis.works_source.2026-03-25.json) &&
          mappings_json=$$(cat /config/mappings.works_source.2026-03-25.json) &&
          printf '{\"settings\":{\"analysis\":%s},\"mappings\":%s}\n' \"$$analysis_json\" \"$$mappings_json\" > /tmp/es-create-index-payload.json &&
          create_status=$$(curl -sS -o /tmp/es-create-index-response.json -w '%{http_code}' -X PUT http://elasticsearch:9200/${es_index} -H 'Content-Type: application/json' --data-binary @/tmp/es-create-index-payload.json) &&
          if [ \"$$create_status\" != '200' ] && [ \"$$create_status\" != '201' ]; then
            echo \"Index creation failed with HTTP $$create_status\" &&
            cat /tmp/es-create-index-response.json &&
            exit 1
          fi &&
          echo 'Index created successfully'
        else
          echo 'Index already exists, skipping creation'
        fi
      "
    volumes:
      - ../../../index_config/analysis.works_source.2026-03-25.json:/config/analysis.works_source.2026-03-25.json:ro
      - ../../../index_config/mappings.works_source.2026-03-25.json:/config/mappings.works_source.2026-03-25.json:ro
    restart: "no"
