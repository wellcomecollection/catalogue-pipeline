[project]
name = "es_index_comparison"
version = "0.1.0"
description = "CLI tool to fetch two Elasticsearch indices and diff their documents field by field."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  "elasticsearch>=9.5,<10",
  "PyYAML>=6.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "deepdiff>=8",
  "pydantic>=2",
]

[project.scripts]
es-index-compare = "es_index_comparison.cli:app"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "mypy>=1.18.2",
  "ruff>=0.14.2",
  "types-pyyaml>=6.0.12.20250915",
]
