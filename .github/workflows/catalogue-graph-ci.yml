name: "Catalogue pipeline: Build and Test"

on:
  push:
    branches:
      - main
    paths:
      - "catalogue_graph/**"
      - ".github/workflows/catalogue-graph-ci.yml"
  pull_request:
    paths:
      - "catalogue_graph/**"
      - ".github/workflows/catalogue-graph-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: wellcomecollection/.github/.github/actions/python_check@main
        with:
          folder: catalogue_graph

  check-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check uv.lock matches pyproject.toml
        working-directory: catalogue_graph
        run: uv lock --check

  check-test-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Regenerate test documents
        working-directory: catalogue_graph
        run: |
          uv run python -m document_generators.create_test_work_documents
          uv run python -m document_generators.create_test_image_documents
          uv run python -m document_generators.create_test_concept_documents
      - name: Check for uncommitted changes
        working-directory: catalogue_graph
        run: git diff --exit-code document_generators/test_documents/

  build-unified-pipeline-task-image:
    runs-on: ubuntu-latest
    needs: [ python-checks ]
    steps:
      - uses: actions/checkout@v7
      - uses: wellcomecollection/.github/.github/actions/docker-build-and-push@main
        with:
          registry: 760097843905.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          folder: catalogue_graph
          target: unified_pipeline_task
          dockerfile: task.Dockerfile
          tag: ${{ github.sha }}
          role_to_assume: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN }}
          # Dependabot and fork runs have no repo secrets, so build without pushing.
          push: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN != '' }}
          publish_latest: ${{ github.ref == 'refs/heads/main' }}

  build-unified-pipeline-lambda-image:
    runs-on: ubuntu-latest
    needs: [ python-checks ]
    steps:
      - uses: actions/checkout@v7
      - uses: wellcomecollection/.github/.github/actions/docker-build-and-push@main
        with:
          registry: 760097843905.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          folder: catalogue_graph
          target: unified_pipeline_lambda
          dockerfile: lambda.Dockerfile
          tag: ${{ github.sha }}
          role_to_assume: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN }}
          # Dependabot and fork runs have no repo secrets, so build without pushing.
          push: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN != '' }}
          publish_latest: ${{ github.ref == 'refs/heads/main' }}

  integration:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN }}
      - name: Get production graph date
        id: graph_date
        run: |
          VALUE=$(aws ssm get-parameter \
            --name /catalogue_graph/production_graph_date \
            --query Parameter.Value --output text)
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: ./.github/actions/run-integration-tests
        with:
          role_to_assume: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN }}
          slack_webhook_secret_id: monitoring/critical_slack_webhook
          graph_date: ${{ steps.graph_date.outputs.value }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ build-unified-pipeline-task-image, build-unified-pipeline-lambda-image ]
    # Deploys move mutable ECR tags, so run one at a time. Queue rather than
    # cancel: retagging precedes the lambda updates that depend on it.
    concurrency:
      group: catalogue-pipeline-deploy
      cancel-in-progress: false
    uses: ./.github/workflows/catalogue-graph-deploy.yml
    with:
      deploy_tag: ${{ github.sha }}
    secrets:
      CATALOGUE_GRAPH_CI_ROLE_ARN: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN }}
