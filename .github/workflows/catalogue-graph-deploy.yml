name: "Catalogue pipeline: Deploy"

on:
  workflow_call:
    inputs:
      deploy_tag:
        description: "Docker image tag to deploy (e.g., commit SHA)"
        required: true
        type: string
    secrets:
      CATALOGUE_GRAPH_CI_ROLE_ARN:
        description: "Role ARN to assume for deploying catalogue graph resources"
        required: true
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: "Tag to deploy (e.g., commit SHA)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Join the deploy queue only when this workflow is the one that was triggered,
# so a hand-run deploy waits for an automatic one. Called from CI the calling
# job already holds this group, and claiming it again here would wait on
# ourselves. The github context in a called workflow is the caller's, so
# github.workflow names us only when we ran directly.
concurrency:
  group: "${{ github.workflow == 'Catalogue pipeline: Deploy' && 'catalogue-pipeline-deploy' || format('catalogue-pipeline-deploy-{0}', github.run_id) }}"
  cancel-in-progress: false

jobs:
  discover-pipeline-dates:
    runs-on: ubuntu-latest
    outputs:
      pipeline_dates: ${{ steps.discover.outputs.pipeline_dates }}
    steps:
      - uses: actions/checkout@v7
      - name: Discover pipeline dates to deploy to
        id: discover
        uses: ./.github/actions/discover-pipeline-dates
        with:
          terraform_dir: pipeline/terraform

  retag-prod-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_name: [ unified_pipeline_task, unified_pipeline_lambda ]
    steps:
      - uses: actions/checkout@v7
        with:
          # The backwards check compares commits, so it needs the history.
          # Blobs are fetched on demand, which keeps the clone cheap.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/retag-docker-image
        with:
          registry: 760097843905.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          image_name: ${{ matrix.image_name }}
          source_tag: ${{ inputs.deploy_tag }}
          target_tag: prod
          role_to_assume: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN }}
          # Guard the automatic path only, so dispatching an older sha stays a
          # way to roll back. github.event_name is the caller's event, which is
          # push for a merge and workflow_dispatch when run by hand.
          enforce_forward_only: ${{ github.event_name != 'workflow_dispatch' }}

  retag-dated-images:
    runs-on: ubuntu-latest
    needs: [ discover-pipeline-dates ]
    strategy:
      matrix:
        pipeline_date: ${{ fromJSON(needs.discover-pipeline-dates.outputs.pipeline_dates) }}
        image_name: [ unified_pipeline_task, unified_pipeline_lambda ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/retag-docker-image
        with:
          registry: 760097843905.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          image_name: ${{ matrix.image_name }}
          source_tag: ${{ inputs.deploy_tag }}
          target_tag: env.${{ matrix.pipeline_date }}
          role_to_assume: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN }}
          enforce_forward_only: ${{ github.event_name != 'workflow_dispatch' }}

  deploy-unified-pipeline-lambdas:
    runs-on: ubuntu-latest
    needs: [ retag-prod-images ]
    strategy:
      matrix:
        lambda_name:
          [
            # Adapter lambdas
            ebsco-adapter-trigger,
            axiell-adapter-trigger,
            folio-adapter-trigger,
            axiell-adapter-mark-published,
            folio-adapter-mark-published,
            axiell-adapter-reconcile,
          ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deploy-lambda-image
        with:
          lambda_name: ${{ matrix.lambda_name }}
          registry: 760097843905.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          image_name: unified_pipeline_lambda
          deploy_tag: prod
          role_to_assume: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN }}

  deploy-dated-unified-pipeline-lambdas:
    name: Deploy dated unified pipeline lambdas
    runs-on: ubuntu-latest
    needs: [ discover-pipeline-dates, retag-dated-images ]
    strategy:
      matrix:
        pipeline_date: ${{ fromJSON(needs.discover-pipeline-dates.outputs.pipeline_dates) }}
        component:
          # ID Minter V2
          - id-minter
          - id-minter-test # remove when we're done testing canonical ids inheritance
          - id-generator
          - id-generator-test # remove when we're done testing canonical ids inheritance
          # Transformer lambdas
          - transformer
          # Graph subsystem lambdas
          - graph-remover
          - graph-es-pit-opener
          - graph-bulk-load-poller
          - graph-bulk-loader
          - graph-remover-incremental
          - graph-ingestor-deletions
          # Image inferrer (work-discovery lambda for the scheduled state machine).
          - image-inference-find-work


    steps:
      - uses: actions/checkout@v7
      - name: Deploy dated pipeline lambda
        uses: ./.github/actions/deploy-dated-pipeline-lambda
        with:
          pipeline_date: ${{ matrix.pipeline_date }}
          registry: 760097843905.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          image_name: unified_pipeline_lambda
          role_to_assume: ${{ secrets.CATALOGUE_GRAPH_CI_ROLE_ARN }}
          aws_region: eu-west-1
          lambda_suffix: ${{ matrix.component }}
